apiVersion: v1
kind: Namespace
metadata:
  name:  demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo
  namespace: demo
  labels:
    app: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-demo
  template:
    metadata:
      labels:
        app: opentelemetry-demo
    spec:
      containers:
        - name: demo
          image: 192.168.10.136/library/demo:20260729
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
            # 如果使用的是 Spring Boot 的 entrypoint 脚本，它会自动读取 JAVA_OPTS
            # 如果不是，需要在启动命令中引用：java $JAVA_OPTS -jar app.jar
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "opentelemetry-demo"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_TIMEOUT
              value: "30000"   # 可选：加大超时到 30 秒
            # 启用所有导出（Trace + Metrics + Logs）
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"

---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo
  namespace: demo
  labels:
    app: opentelemetry-demo
spec:
  type: NodePort
  selector:
    app: opentelemetry-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP